<svg width="920" height="250" viewBox="0 0 920 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Simple animated security workflow: logs flow into ARGUS reasoning, signals, NOCTRA SOC, and final verdict">
  <style>
    .bg { fill: #0d1117; }
    .panel { fill: #111820; stroke: #30363d; stroke-width: 1.2; }
    .panel-hot { stroke: #f43f5e; }
    .label { fill: #8b949e; font: 700 10px Inter,Segoe UI,Arial,sans-serif; letter-spacing: .16em; }
    .title { fill: #f0f6fc; font: 800 16px Inter,Segoe UI,Arial,sans-serif; letter-spacing: .04em; }
    .sub { fill: #8b949e; font: 500 12px Inter,Segoe UI,Arial,sans-serif; }
    .rail { stroke: #30363d; stroke-width: 3; stroke-linecap: round; }
    .rail-active { stroke: #f43f5e; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 18 18; opacity: .68; animation: dash 1.8s linear infinite; }
    .node { fill: #0d1117; stroke: #30363d; stroke-width: 2; }
    .node-hot { stroke: #f43f5e; }
    .packet { fill: #f43f5e; filter: drop-shadow(0 0 7px rgba(244,63,94,.65)); animation: packet 5.2s ease-in-out infinite; }
    .packet.two { animation-delay: 1.7s; opacity: .82; }
    .packet.three { animation-delay: 3.4s; opacity: .68; }
    .scan { fill: #f43f5e; opacity: .07; animation: scan 4.5s ease-in-out infinite; }
    .blink { animation: blink 2.4s ease-in-out infinite; }
    @keyframes dash {
      to { stroke-dashoffset: -36; }
    }
    @keyframes packet {
      0%, 8% { transform: translate(96px, 124px); opacity: 0; }
      16% { opacity: 1; }
      32% { transform: translate(286px, 124px); }
      50% { transform: translate(460px, 124px); }
      68% { transform: translate(634px, 124px); }
      86% { transform: translate(800px, 124px); opacity: 1; }
      96%, 100% { transform: translate(800px, 124px); opacity: 0; }
    }
    @keyframes scan {
      0%, 100% { transform: translateX(-18px); opacity: .04; }
      50% { transform: translateX(18px); opacity: .12; }
    }
    @keyframes blink {
      0%, 100% { opacity: .58; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .rail-active, .packet, .scan, .blink { animation: none; }
    }
  </style>

  <rect class="bg" width="920" height="250" rx="18"/>
  <rect x="24" y="22" width="872" height="206" rx="16" fill="#0f1620" stroke="#30363d" opacity=".75"/>
  <rect class="scan" x="48" y="62" width="824" height="124" rx="18"/>

  <path class="rail" d="M110 124H810"/>
  <path class="rail-active" d="M110 124H810"/>

  <g transform="translate(48 72)">
    <rect class="panel" width="126" height="104" rx="14"/>
    <text class="label" x="22" y="32">INPUT</text>
    <text class="title" x="22" y="58">Logs</text>
    <text class="sub" x="22" y="82">raw events</text>
  </g>

  <g transform="translate(222 72)">
    <rect class="panel panel-hot" width="126" height="104" rx="14"/>
    <text class="label" x="22" y="32">ARGUS</text>
    <text class="title" x="22" y="58">Reason</text>
    <text class="sub" x="22" y="82">attack graph</text>
  </g>

  <g transform="translate(396 72)">
    <rect class="panel" width="126" height="104" rx="14"/>
    <text class="label" x="22" y="32">SIGNALS</text>
    <text class="title" x="22" y="58">Context</text>
    <text class="sub" x="22" y="82">rules + AI</text>
  </g>

  <g transform="translate(570 72)">
    <rect class="panel panel-hot" width="126" height="104" rx="14"/>
    <text class="label" x="22" y="32">NOCTRA</text>
    <text class="title" x="22" y="58">Triage</text>
    <text class="sub" x="22" y="82">SOC workflow</text>
  </g>

  <g transform="translate(744 72)">
    <rect class="panel" width="126" height="104" rx="14"/>
    <text class="label" x="22" y="32">OUTPUT</text>
    <text class="title" x="22" y="58">Verdict</text>
    <text class="sub" x="22" y="82">incident path</text>
  </g>

  <circle class="node" cx="110" cy="124" r="8"/>
  <circle class="node node-hot blink" cx="286" cy="124" r="8"/>
  <circle class="node" cx="460" cy="124" r="8"/>
  <circle class="node node-hot blink" cx="634" cy="124" r="8"/>
  <circle class="node" cx="810" cy="124" r="8"/>

  <circle class="packet" r="5"/>
  <circle class="packet two" r="5"/>
  <circle class="packet three" r="5"/>

  <text class="label" x="48" y="209">LIVE SECURITY WORKFLOW</text>
  <text class="sub" x="662" y="210">logs -> reasoning -> detections -> triage -> verdict</text>
</svg>
